; ============================================
; PHP-FPM pool configuration: [www]
; ============================================

[www]

listen = 0.0.0.0:9000

; --- Process manager ---
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; --- Logging ---
access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
catch_workers_output = yes
decorate_workers_output = no

; --- Env ---
clear_env = no

; --- Health ---
ping.path = /fpm-ping
ping.response = pong
