; ============================================
; Application PHP settings
; Loaded after default php.ini, so it overrides.
; ============================================

; --- Error handling ---
error_reporting = E_ALL
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; --- Memory / timeouts ---
memory_limit = 256M
max_execution_time = 30
max_input_time = 60

; --- File uploads ---
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; --- Locale / timezone ---
date.timezone = UTC
intl.default_locale = en_US

; --- OPcache (tuned further for prod) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Security ---
expose_php = Off
