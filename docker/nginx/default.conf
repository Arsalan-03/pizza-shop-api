# =============================================================================
# Nginx default server configuration
# =============================================================================

server {
    listen 80;
    server_name _;

    # Root points to Symfony's public directory.
    root /var/www/html/public;
    index index.php;

    # Max upload size — must be >= PHP's upload_max_filesize (32M).
    client_max_body_size 32M;

    # Charset for text responses.
    charset utf-8;

    # ---- Logs ----
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # ---- Symfony front controller ----
    # All non-file requests go to index.php (Symfony's entry point).
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # ---- PHP-FPM ----
    # Pass .php requests to the FPM container via FastCGI.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Timeouts — generous enough for dev, tighten in prod if needed.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Symfony's front controller is the only public PHP file.
        internal;
    }

    # Deny access to other .php files (safety net).
    location ~ \.php$ {
        return 404;
    }

    # ---- Static assets ----
    # Cache static files for a day.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        access_log off;
    }

    # ---- Hidden files ----
    # Deny access to dotfiles (.env, .git, etc.).
    location ~ /\. {
        deny all;
    }
}
